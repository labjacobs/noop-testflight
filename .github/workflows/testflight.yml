# Builds ryanbr/noop's iOS app, signs it with our own Apple Developer team (so the HealthKit
# entitlement is actually provisioned), and uploads it to TestFlight.
#
# Runs daily: if upstream has a new stable release that we haven't uploaded yet, it builds it.
# Run it by hand from the Actions tab to build now, or to build a specific ref (e.g. `main`).
# See README.md for the one-time Apple / GitHub setup.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ryanbr/noop ref to build (blank = latest stable release)"
        required: false
        default: ""
      force:
        description: "Build even if this commit was already uploaded"
        type: boolean
        default: false
  schedule:
    # 18:00 UTC = 4-5am in Australia.
    - cron: "0 18 * * *"

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  UPSTREAM: ryanbr/noop

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      sha: ${{ steps.pick.outputs.sha }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Pick upstream ref
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)
          fi
          sha=$(gh api "repos/$UPSTREAM/commits/$ref" -q .sha)
          echo "Building $UPSTREAM @ $ref ($sha)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A cache entry keyed on the commit marks "already uploaded", so the daily run is a no-op
      # until upstream ships a new release.
      - name: Already uploaded?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .uploaded
          key: testflight-uploaded-${{ steps.pick.outputs.sha }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [ "${{ steps.seen.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Commit already uploaded; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    # iOS 26 SDK is required (Liquid Glass), same runner upstream's release workflow uses.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID_PREFIX: ${{ secrets.BUNDLE_ID_PREFIX }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_TIMESTAMP: "1"
    steps:
      - name: Check secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
        run: |
          missing=0
          for v in TEAM_ID BUNDLE_ID_PREFIX ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 DIST_CERT_P12_BASE64 DIST_CERT_P12_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see README.md)"; missing=1; fi
          done
          exit $missing

      - name: Checkout ${{ env.UPSTREAM }} @ ${{ needs.check.outputs.ref }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          command -v fastlane >/dev/null || brew install fastlane
          fastlane --version | tail -1

      - name: Configure project
        run: |
          set -euo pipefail
          # Our own bundle ids / App Group / team (Config/BundleId.xcconfig optionally includes this file).
          cat > Config/BundleIdSecrets.xcconfig <<EOF
          BUNDLE_ID_PREFIX = $BUNDLE_ID_PREFIX
          DEVELOPMENT_TEAM = $TEAM_ID
          EOF

          # Drop the embedded watch app, as upstream's sideload .ipa does: no Apple Watch here, and it
          # would need two more App IDs and profiles.
          test "$(grep -c '^      - target: NOOPWatch$' project.yml)" = 1
          sed -i '' '/^      - target: NOOPWatch$/d' project.yml

          xcodegen generate

          # Only standard HTTPS is used, which is exempt; saves answering export compliance per build.
          plist=StrandiOS/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist"

          base=$(grep -E '^ +CURRENT_PROJECT_VERSION:' project.yml | head -1 | tr -cd '0-9')
          echo "BUILD_NUMBER=$base.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION: $(grep -E '^ +MARKETING_VERSION:' project.yml | head -1)"

      - name: Install signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw=$(uuidgen)
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$DIST_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$kc"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          python3 - "$key" > "$RUNNER_TEMP/asc_api_key.json" <<'PY'
          import json, os, sys
          print(json.dumps({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                            "key": open(sys.argv[1]).read(), "in_house": False}))
          PY

      # Finds (or creates) an App Store profile per bundle id, installs it, and points each Xcode
      # target at its own profile via $(NOOP_PROFILE_$(TARGET_NAME)) in the project-level xcconfig.
      - name: Provisioning profiles
        run: |
          set -euo pipefail
          dirs=("$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles")
          mkdir -p "${dirs[@]}" "$RUNNER_TEMP/profiles"
          echo 'PROVISIONING_PROFILE_SPECIFIER = $(NOOP_PROFILE_$(TARGET_NAME))' >> Config/BundleIdSecrets.xcconfig
          export_profiles=""

          fetch() {
            local target="$1" bundle_id="$2" needs="$3"
            local file="$RUNNER_TEMP/profiles/$target.mobileprovision"
            fastlane run get_provisioning_profile \
              app_identifier:"$bundle_id" team_id:"$TEAM_ID" \
              api_key_path:"$RUNNER_TEMP/asc_api_key.json" \
              output_path:"$RUNNER_TEMP/profiles" filename:"$target.mobileprovision" \
              skip_install:true
            security cms -D -i "$file" > "$RUNNER_TEMP/$target.plist"
            local uuid name
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$target.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$target.plist")
            for e in $needs; do
              if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:$e" "$RUNNER_TEMP/$target.plist" >/dev/null 2>&1; then
                echo "::error::Profile '$name' for $bundle_id lacks $e. Enable that capability on the App ID (README step 2), then re-run."
                exit 1
              fi
            done
            for d in "${dirs[@]}"; do cp "$file" "$d/$uuid.mobileprovision"; done
            echo "NOOP_PROFILE_$target = $name" >> Config/BundleIdSecrets.xcconfig
            export_profiles+="<key>$bundle_id</key><string>$name</string>"
            echo "$target -> $name ($uuid)"
          }

          fetch NOOPiOS        "$BUNDLE_ID_PREFIX.noop"         "com.apple.developer.healthkit com.apple.security.application-groups"
          fetch NOOPiOSWidgets "$BUNDLE_ID_PREFIX.noop.widgets" "com.apple.security.application-groups"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>$export_profiles</dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          echo "--- Config/BundleIdSecrets.xcconfig"; cat Config/BundleIdSecrets.xcconfig

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -project Strand.xcodeproj -scheme NOOPiOS -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NOOP.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || {
              grep -E 'error:' "$RUNNER_TEMP/archive.log" | sort -u | head -50
              echo "--- last 100 lines"; tail -100 "$RUNNER_TEMP/archive.log"
              exit 1
            }
          tail -5 "$RUNNER_TEMP/archive.log"
          app="$RUNNER_TEMP/NOOP.xcarchive/Products/Applications/NOOP.app"
          echo "--- Signed entitlements"
          codesign -d --entitlements - --xml "$app" | plutil -convert xml1 -o - -

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NOOP.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER of ${{ needs.check.outputs.ref }}. It appears in TestFlight after Apple finishes processing (usually 5-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Mark commit as uploaded
        run: mkdir -p .uploaded && echo "$BUILD_NUMBER" > .uploaded/build

      - uses: actions/cache/save@v4
        with:
          path: .uploaded
          key: testflight-uploaded-${{ needs.check.outputs.sha }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
